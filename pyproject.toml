[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "minicode-loop"
version = "0.1.0"
description = "A self-regulating terminal coding assistant for local development workflows."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
    "build>=1.2.0",
    "hypothesis>=6.0.0",
    "mypy>=1.11.0",
    "pytest>=8.0.0",
    "ruff>=0.6.0",
    "setuptools>=68",
]

[project.scripts]
minicode-py = "minicode.main:main"
minicode-headless = "minicode.headless:main"
minicode-readiness = "minicode.readiness:main"
minicode-structure-check = "minicode.structure_check:main"
minicode-provider-smoke = "minicode.provider_smoke:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests", "Main", "Package"]
python_files = ["test_*.py", "*.Test.py"]
addopts = ["--import-mode=importlib"]

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["minicode*", "Main*", "Package*"]
namespaces = true


[tool.mypy]
python_version = "3.11"
explicit_package_bases = true
warn_return_any = false
warn_unused_configs = true
ignore_missing_imports = true
check_untyped_defs = false
